<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A2240">
<meta name="description" content="Manuais do CEL, planos de aula, provas e gabaritos para os professores.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Recursos do Professor CEL</title>
<style>@font-face{font-family:'Lora';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/Lora-Bold.woff) format('woff')}@font-face{font-family:'Figtree';font-weight:300 900;font-style:normal;font-display:swap;src:url(fonts/Figtree.woff) format('woff')}@font-face{font-family:'Plex Mono';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/IBMPlexMono-Regular.woff) format('woff')}@font-face{font-family:'Plex Mono';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/IBMPlexMono-Medium.woff) format('woff')}
/* Conceito: o caderno do professor do CEL — papel quadriculado da escola, marcadores de livro na navegação,
   azul-marinho e dourado do CEL com as cores da bandeira; planos e provas aparecem como folhas A4 sobre a mesa. */
:root {
  --paper: #F2F4F8; --grid: rgba(10, 34, 64, .055); --surface: #FFFFFF; --surface-2: #ECF0F6; --ink: #0F1E36; --ink-2: #46536D; --ink-3: #737F96;
  --line: #D5DCE7; --line-2: #BCC6D6;
  --brand: #0A2240; --brand-2: #163A6A; --brand-ink: #FFFFFF; --brand-ink-2: #B9C6DC;
  --amber: #F2B705; --amber-ink: #2A1F00; --amber-soft: #FFF2C2; --amber-line: #E5C65A;
  --ok: #0F7A45; --ok-soft: #E0F2E7; --danger: #B5122C; --danger-soft: #FBE5E9; --info-soft: #E6EEFB;
  --btn: #0A2240; --btn-ink: #FFFFFF; --btn-hover: #163A6A; --link: #1B4C9A; --focus: #2F6FED;
  --sheet: #FFFFFF; --sheet-ink: #1A2236; --sheet-mute: #5D6676; --sheet-line: #B8C2D3; --sheet-head: #E9EDF4; --sheet-navy: #0A2240; --sheet-gold: #A6791A;
  --f-display: 'Lora', Georgia, 'Times New Roman', serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 10px; --r-sm: 6px; --shadow: 0 1px 2px rgba(10, 34, 64, .06), 0 6px 18px rgba(10, 34, 64, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0A111E; --grid: rgba(242, 183, 5, .045); --surface: #111A2B; --surface-2: #172237; --ink: #E6EBF3; --ink-2: #A6B1C6; --ink-3: #7B879E;
    --line: #243049; --line-2: #33415E; --brand: #071830; --brand-2: #10284A; --brand-ink: #FFFFFF; --brand-ink-2: #9FB0CC;
    --amber: #F5C232; --amber-ink: #241A00; --amber-soft: #352A08; --amber-line: #6B5715;
    --ok: #46C985; --ok-soft: #0E2A1C; --danger: #FF6B7F; --danger-soft: #3A1520; --info-soft: #16243F;
    --btn: #F5C232; --btn-ink: #13213A; --btn-hover: #FFD45E; --link: #93B6FF; --focus: #8FB0FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0A111E; --grid: rgba(242, 183, 5, .045); --surface: #111A2B; --surface-2: #172237; --ink: #E6EBF3; --ink-2: #A6B1C6; --ink-3: #7B879E;
  --line: #243049; --line-2: #33415E; --brand: #071830; --brand-2: #10284A; --brand-ink: #FFFFFF; --brand-ink-2: #9FB0CC;
  --amber: #F5C232; --amber-ink: #241A00; --amber-soft: #352A08; --amber-line: #6B5715;
  --ok: #46C985; --ok-soft: #0E2A1C; --danger: #FF6B7F; --danger-soft: #3A1520; --info-soft: #16243F;
  --btn: #F5C232; --btn-ink: #13213A; --btn-hover: #FFD45E; --link: #93B6FF; --focus: #8FB0FF;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body {
  margin: 0; background-color: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--brand) }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; letter-spacing: .005em; line-height: 1.15; margin: 0; text-wrap: balance; color: var(--ink) }
p { margin: 0 }
a { color: var(--link) }
button, input, select, textarea { font: inherit; color: inherit }
input:not([type]), input[type=text], input[type=number], input[type=search], input[type=date], select, textarea {
  border: 1px solid var(--line-2); border-radius: var(--r-sm); background-color: var(--surface); color: var(--ink); padding: 6px 9px; min-height: 36px; max-width: 100% }
textarea { line-height: 1.45; resize: vertical }
fieldset input[type=text], fieldset textarea { width: 100% }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 4px }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }

/* ---------- topo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); color: var(--brand-ink); border-bottom: 3px solid var(--amber) }
.top-in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.top img { height: 44px; width: auto; display: block }
.brand { display: flex; flex-direction: column; min-width: 0 }
.brand b { font-family: var(--f-display); font-size: 21px; font-weight: 700; letter-spacing: .005em; line-height: 1.05; color: var(--brand-ink) }
.brand span { font-size: 12.5px; color: var(--brand-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mode { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--brand-ink-2); border: 1px solid rgba(255, 255, 255, .18); border-radius: 999px; padding: 5px 11px; white-space: nowrap }
.mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-ink-2) }
.mode .s { display: none }
@media (max-width: 560px) { .mode .l { display: none } .mode .s { display: inline } .top img { height: 38px } .brand b { font-size: 20px } }
.mode[data-mode="cloud"] i { background: #46C985 } .mode[data-mode="local"] i { background: var(--amber) } .mode[data-mode="wait"] i { animation: pulse 1.2s infinite }
@keyframes pulse { 50% { opacity: .3 } }

/* ---------- quadro (navegação) */
.layout { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 24px; padding-block: 22px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; box-shadow: var(--shadow) }
.nav-label { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px 6px }
.nav button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: var(--r-sm); text-align: left; cursor: pointer; color: var(--ink-2); font-weight: 500 }
.nav button:hover { background: var(--surface-2); color: var(--ink) }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--ink); font-weight: 700 }
.mark { flex: none; width: 10px; height: 22px; background: var(--line-2); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%); transition: background .18s, transform .18s }
.nav button[aria-current="page"] .mark { background: var(--amber); transform: translateY(-2px) }
.nav-foot { border-top: 1px dashed var(--line); margin-top: 6px; padding: 9px 10px 4px; font-size: 12px; color: var(--ink-3) }
@media (max-width: 920px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 12px 48px }
  .nav { position: static; display: flex; gap: 4px; overflow-x: auto; padding: 6px; scrollbar-width: thin }
  .nav button { width: auto; white-space: nowrap; padding: 8px 10px }
  .nav-label, .nav-foot { display: none }
  .brand span { display: none }
}
main { min-width: 0 }
main:focus { outline: none }

/* ---------- blocos comuns */
.view { display: flex; flex-direction: column; gap: 18px; min-width: 0 }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px }
.head h1 { font-size: clamp(26px, 3.2vw, 34px) }
.head p { color: var(--ink-2); max-width: 70ch }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0 }
.card h2 { font-size: 21px; margin-bottom: 10px }
.card h3 { font-size: 17px; margin-bottom: 8px }
.muted { color: var(--ink-2) } .small { font-size: 13px } .tiny { font-size: 12px; color: var(--ink-3) }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.row.end { justify-content: flex-end } .grow { flex: 1 1 auto }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start }
.split.doc { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) }
@media (max-width: 1100px) { .split, .split.doc { grid-template-columns: minmax(0, 1fr) } .split.doc > div[style*=sticky] { position: static !important } }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0 }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap }
.btn:hover { background: var(--surface-2) }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn) }
.btn.primary:hover { background: var(--btn-hover) }
.btn.warn { color: var(--danger); border-color: var(--danger) }
.btn.ghost { border-color: transparent; background: none }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.btn svg { width: 16px; height: 16px; flex: none }
.btn.wrap { white-space: normal; text-align: left; justify-content: flex-start; max-width: 100% }
.btn.wrap.next { text-align: right; justify-content: flex-end; margin-left: auto }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap }
.chip.amber { background: var(--amber-soft); color: var(--ink); border-color: var(--amber-line) }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.chip.unit { font-family: var(--f-mono); font-weight: 500 }
.dots { letter-spacing: 1px; color: var(--amber) }

.callout { border-radius: var(--r); padding: 13px 15px; border: 1px solid var(--line); background: var(--info-soft); display: flex; gap: 12px; align-items: flex-start }
.callout b { display: block; margin-bottom: 2px }
.callout.warn { background: var(--amber-soft); border-color: var(--amber-line) }
.callout.danger { background: var(--danger-soft); border-color: transparent; border-left: 5px solid var(--danger) }
.callout > svg { flex: none; width: 22px; height: 22px; margin-top: 1px }
.callout.danger > svg { color: var(--danger) }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field label, .lbl { font-size: 12.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .01em }
.field input, .field select, .field textarea, .inp {
  width: 100%; min-height: 38px; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink) }
.field textarea { min-height: 76px; resize: vertical; line-height: 1.45 }
.field .hint { font-size: 12px; color: var(--ink-3) }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; cursor: pointer }
.check input { width: 17px; height: 17px; accent-color: var(--brand-2) }
fieldset { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; margin: 0; min-width: 0 }
legend { font-size: 12.5px; font-weight: 700; color: var(--ink-2); padding: 0 4px }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto }
.tabs button { border: 0; background: none; padding: 9px 13px; cursor: pointer; color: var(--ink-2); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber) }

.empty { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 22px; text-align: center; color: var(--ink-2) }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--amber-soft); border: 1px solid var(--amber-line); border-radius: var(--r-sm); padding: 8px 10px; font-size: 13.5px }

/* ---------- início */
.hero { background: var(--brand); color: var(--brand-ink); border-radius: var(--r); padding: 24px 24px 22px; position: relative; overflow: hidden }
.hero::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none }
.hero > * { position: relative; z-index: 1 }
.hero .eyebrow { color: var(--amber) }
.hero h1 { color: var(--brand-ink); font-size: clamp(30px, 4vw, 44px); font-weight: 700; margin: 6px 0 8px }
.hero p { color: var(--brand-ink-2); max-width: 62ch }
.hero .flagline { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; display: flex; z-index: 1 }
.hero .flagline i { flex: 1 } .hero .flagline i:nth-child(1) { background: #C8102E } .hero .flagline i:nth-child(2) { background: #F2C200 } .hero .flagline i:nth-child(3) { background: #00843D }
.hero .book { position: absolute; right: 22px; top: 18px; width: 150px; height: 96px; z-index: 0; opacity: .85 }
@media (max-width: 760px) { .hero .book { display: none } }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; color: var(--ink); box-shadow: var(--shadow) }
.tile:hover { border-color: var(--line-2); transform: translateY(-1px) }
.tile .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase }
.tile b { font-family: var(--f-display); font-size: 20px; font-weight: 700 }
.tile span { color: var(--ink-2); font-size: 14px }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px }
.meter { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px }
.meter b { display: block; font-family: var(--f-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1 }
.meter span { font-size: 12.5px; color: var(--ink-2) }

/* ---------- biblioteca */
.lib { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start }
@media (max-width: 1000px) { .lib { grid-template-columns: minmax(0, 1fr) } }
.tree { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); max-height: calc(100vh - 100px); overflow: auto }
@media (max-width: 1000px) { .tree { position: static; max-height: none } }
.tree h3 { font-size: 16px; margin: 4px 0 2px }
.unit { margin-top: 12px }
.unit > div { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px }
.lsn { display: flex; gap: 9px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: var(--r-sm); cursor: pointer; color: var(--ink-2); align-items: baseline }
.lsn:hover { background: var(--surface-2); color: var(--ink) }
.lsn[aria-current="true"] { background: var(--amber-soft); color: var(--ink); font-weight: 650 }
.lsn .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); flex: none }
.lesson { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 74px) }
.lesson h2 { font-size: clamp(25px, 3vw, 32px); margin: 4px 0 8px }
.lesson section { margin-top: 18px }
.lesson section > h3 { font-size: 17px; margin-bottom: 7px; display: flex; align-items: center; gap: 8px }
.lesson section > h3::before { content: ""; width: 10px; height: 10px; border: 2px solid var(--amber); border-radius: 50%; flex: none }
.lesson ul, .lesson ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px }
.lesson .resumo p + p { margin-top: 8px }
.lesson .resumo { font-size: 16px; max-width: 72ch }
.kw { display: flex; flex-wrap: wrap; gap: 6px }
.kw button { cursor: pointer }
.pn { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap }
.gloss dl { margin: 0; display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 10px 18px }
.gloss dt { font-weight: 700 } .gloss dd { margin: 0; color: var(--ink-2) }
@media (max-width: 640px) { .gloss dl { grid-template-columns: minmax(0, 1fr) } .gloss dd { margin-bottom: 8px } }
.syms { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px }
.sym { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px }
.sym svg { width: 100%; height: 64px; color: var(--ink); display: block; margin-bottom: 6px }
.sym b { display: block; font-size: 14.5px } .sym span { font-size: 13px; color: var(--ink-2) }

/* ---------- folhas (pré-visualização dos documentos) */
.sheetwrap { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; overflow-x: auto }
.sheet { background: var(--sheet); color: var(--sheet-ink); width: 100%; max-width: 760px; margin: 0 auto; padding: 32px 34px; box-shadow: 0 2px 10px rgba(10, 34, 64, .18); font: 13.5px/1.45 var(--f-body) }
.sheet h1, .sheet h2, .sheet h3 { color: var(--sheet-navy); font-family: var(--f-body); font-weight: 700 }
.sheet h1 { font-size: 20px; border-bottom: 2px solid var(--sheet-gold); padding-bottom: 4px; margin: 8px 0 8px }
.sheet h2 { font-size: 15.5px; margin: 14px 0 5px } .sheet h3 { font-size: 14px; margin: 10px 0 4px }
.sheet p { margin: 0 0 5px }
.sheet ul, .sheet ol { margin: 0 0 6px; padding-left: 22px }
.sheet table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 0 0 8px }
.sheet td, .sheet th { border: 1px solid var(--sheet-line); padding: 4px 6px; vertical-align: top; text-align: left; word-wrap: break-word }
.sheet th, .sheet td.sh { background: var(--sheet-head) }
.sheet th { overflow-wrap: normal; word-break: keep-all }
.sheet table.nb td { border: 0; padding: 0 }
.sheet .c-navy { color: var(--sheet-navy) } .sheet .c-gold { color: var(--sheet-gold) } .sheet .c-mute { color: var(--sheet-mute) }
.sheet .pbreak { border-top: 2px dashed var(--sheet-line); margin: 22px -34px; position: relative }
.sheet .pbreak::after { content: "nova página"; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); background: var(--sheet); color: var(--sheet-mute); font-size: 11px; padding: 0 8px }
.sheet .ind { padding-left: 24px }
@media (max-width: 600px) { .sheet { padding: 18px 16px; font-size: 12.5px } .sheet .pbreak { margin-left: -16px; margin-right: -16px } }

/* ---------- listas guardadas e banco */
.items { display: flex; flex-direction: column; gap: 10px }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center }
.item .t { font-weight: 700 } .item .grow { min-width: 200px }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 7px }
.q .txt { font-size: 15px } .q ol { margin: 0; padding-left: 22px }
.q details summary { cursor: pointer; color: var(--link); font-size: 13.5px; font-weight: 600 }
.q .ans { margin-top: 6px; background: var(--ok-soft); border-radius: var(--r-sm); padding: 8px 10px; font-size: 14px }
.q li.ok { font-weight: 700; color: var(--ok) }

/* ---------- dados cifrados */
async function carregaDados(key) {

  if (!r.ok) throw new Error('dados ' + r.status);
  const gz = await C.decifra(key, new Uint8Array(await r.arrayBuffer()));

}

  navigator.serviceWorker.register('sw.js').then((reg) => {
    window.__celReg = reg;
    const ve = (w) => { if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) { novaVersao = w; barra(); } }); };
    if (reg.waiting && navigator.serviceWorker.controller) { novaVersao = reg.waiting; barra(); }
    reg.addEventListener('updatefound', () => ve(reg.installing));
    if (navigator.onLine !== false) reg.update().catch(() => {});
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (pedidoAtualizar) { pedidoAtualizar = false; location.reload(); } });
}
// com a aplicação aberta: verificar o acesso quando volta a haver rede ou quando se volta à aplicação (no máximo de 6 em 6 horas)
const talvezConsultar = () => { if (!LS.get(K.ativ, null) || !booted) return; if (Date.now() - LS.get(K.consulta, 0) > 6 * 3600e3) consulta(); };
window.addEventListener('online', talvezConsultar);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') talvezConsultar(); });

/* ---------- arranque */
async function inicio() {
  if (!LS.ok) { telaErro('Este navegador não deixa guardar dados', 'Abra a aplicação no Chrome, fora do modo anónimo.'); return; }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') { telaErro('Abra a aplicação no Chrome', 'Este navegador não consegue abrir os manuais protegidos. Use o Chrome atualizado e o endereço da aplicação (https).'); return; }
  const dia = hoje(), act = LS.get(K.ativ, null), estado = LS.get(K.estado, null);
  if (!act) {
    if (estado === 'retirado') { telaBloqueio('retirado'); return; }
    if (pedidosDoAparelho().length) telaAtivar(); else telaRegisto();
    return;
  }
  if (estado === 'suspenso') { telaBloqueio('suspenso'); if ((await consulta()) === 'ok') inicio(); return; }
  if (act.dias < dia) { telaBloqueio('expirado'); return; }
  if (dia - LS.get(K.verif, 0) > CFG.diasSemLigacao) { telaBloqueio('verificar'); if ((await consulta()) === 'ok') inicio(); return; }
  if (await abrirApp(act)) consulta();
}
inicio();
})();
