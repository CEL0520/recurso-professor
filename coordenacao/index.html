/* Conceito: o caderno do professor do CEL — papel quadriculado da escola, marcadores de livro na navegação,
   azul-marinho e dourado do CEL com as cores da bandeira; planos e provas aparecem como folhas A4 sobre a mesa. */
:root {
  --paper: #F2F4F8; --grid: rgba(10, 34, 64, .055); --surface: #FFFFFF; --surface-2: #ECF0F6; --ink: #0F1E36; --ink-2: #46536D; --ink-3: #737F96;
  --line: #D5DCE7; --line-2: #BCC6D6;
  --brand: #0A2240; --brand-2: #163A6A; --brand-ink: #FFFFFF; --brand-ink-2: #B9C6DC;
  --amber: #F2B705; --amber-ink: #2A1F00; --amber-soft: #FFF2C2; --amber-line: #E5C65A;
  --ok: #0F7A45; --ok-soft: #E0F2E7; --danger: #B5122C; --danger-soft: #FBE5E9; --info-soft: #E6EEFB;
  --btn: #0A2240; --btn-ink: #FFFFFF; --btn-hover: #163A6A; --link: #1B4C9A; --focus: #2F6FED;
  --sheet: #FFFFFF; --sheet-ink: #1A2236; --sheet-mute: #5D6676; --sheet-line: #B8C2D3; --sheet-head: #E9EDF4; --sheet-navy: #0A2240; --sheet-gold: #A6791A;
  --f-display: 'Lora', Georgia, 'Times New Roman', serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 10px; --r-sm: 6px; --shadow: 0 1px 2px rgba(10, 34, 64, .06), 0 6px 18px rgba(10, 34, 64, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0A111E; --grid: rgba(242, 183, 5, .045); --surface: #111A2B; --surface-2: #172237; --ink: #E6EBF3; --ink-2: #A6B1C6; --ink-3: #7B879E;
    --line: #243049; --line-2: #33415E; --brand: #071830; --brand-2: #10284A; --brand-ink: #FFFFFF; --brand-ink-2: #9FB0CC;
    --amber: #F5C232; --amber-ink: #241A00; --amber-soft: #352A08; --amber-line: #6B5715;
    --ok: #46C985; --ok-soft: #0E2A1C; --danger: #FF6B7F; --danger-soft: #3A1520; --info-soft: #16243F;
    --btn: #F5C232; --btn-ink: #13213A; --btn-hover: #FFD45E; --link: #93B6FF; --focus: #8FB0FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0A111E; --grid: rgba(242, 183, 5, .045); --surface: #111A2B; --surface-2: #172237; --ink: #E6EBF3; --ink-2: #A6B1C6; --ink-3: #7B879E;
  --line: #243049; --line-2: #33415E; --brand: #071830; --brand-2: #10284A; --brand-ink: #FFFFFF; --brand-ink-2: #9FB0CC;
  --amber: #F5C232; --amber-ink: #241A00; --amber-soft: #352A08; --amber-line: #6B5715;
  --ok: #46C985; --ok-soft: #0E2A1C; --danger: #FF6B7F; --danger-soft: #3A1520; --info-soft: #16243F;
  --btn: #F5C232; --btn-ink: #13213A; --btn-hover: #FFD45E; --link: #93B6FF; --focus: #8FB0FF;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body {
  margin: 0; background-color: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--brand) }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; letter-spacing: .005em; line-height: 1.15; margin: 0; text-wrap: balance; color: var(--ink) }
p { margin: 0 }
a { color: var(--link) }
button, input, select, textarea { font: inherit; color: inherit }
input:not([type]), input[type=text], input[type=number], input[type=search], input[type=date], select, textarea {
  border: 1px solid var(--line-2); border-radius: var(--r-sm); background-color: var(--surface); color: var(--ink); padding: 6px 9px; min-height: 36px; max-width: 100% }
textarea { line-height: 1.45; resize: vertical }
fieldset input[type=text], fieldset textarea { width: 100% }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 4px }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }

/* ---------- topo */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); color: var(--brand-ink); border-bottom: 3px solid var(--amber) }
.top-in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.top img { height: 44px; width: auto; display: block }
.brand { display: flex; flex-direction: column; min-width: 0 }
.brand b { font-family: var(--f-display); font-size: 21px; font-weight: 700; letter-spacing: .005em; line-height: 1.05; color: var(--brand-ink) }
.brand span { font-size: 12.5px; color: var(--brand-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mode { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--brand-ink-2); border: 1px solid rgba(255, 255, 255, .18); border-radius: 999px; padding: 5px 11px; white-space: nowrap }
.mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-ink-2) }
.mode .s { display: none }
@media (max-width: 560px) { .mode .l { display: none } .mode .s { display: inline } .top img { height: 38px } .brand b { font-size: 20px } }
.mode[data-mode="cloud"] i { background: #46C985 } .mode[data-mode="local"] i { background: var(--amber) } .mode[data-mode="wait"] i { animation: pulse 1.2s infinite }
@keyframes pulse { 50% { opacity: .3 } }

/* ---------- quadro (navegação) */
.layout { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 24px; padding-block: 22px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; box-shadow: var(--shadow) }
.nav-label { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px 6px }
.nav button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: var(--r-sm); text-align: left; cursor: pointer; color: var(--ink-2); font-weight: 500 }
.nav button:hover { background: var(--surface-2); color: var(--ink) }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--ink); font-weight: 700 }
.mark { flex: none; width: 10px; height: 22px; background: var(--line-2); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%); transition: background .18s, transform .18s }
.nav button[aria-current="page"] .mark { background: var(--amber); transform: translateY(-2px) }
.nav-foot { border-top: 1px dashed var(--line); margin-top: 6px; padding: 9px 10px 4px; font-size: 12px; color: var(--ink-3) }
@media (max-width: 920px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 12px 48px }
  .nav { position: static; display: flex; gap: 4px; overflow-x: auto; padding: 6px; scrollbar-width: thin }
  .nav button { width: auto; white-space: nowrap; padding: 8px 10px }
  .nav-label, .nav-foot { display: none }
  .brand span { display: none }
}
main { min-width: 0 }
main:focus { outline: none }

/* ---------- blocos comuns */
.view { display: flex; flex-direction: column; gap: 18px; min-width: 0 }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px }
.head h1 { font-size: clamp(26px, 3.2vw, 34px) }
.head p { color: var(--ink-2); max-width: 70ch }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0 }
.card h2 { font-size: 21px; margin-bottom: 10px }
.card h3 { font-size: 17px; margin-bottom: 8px }
.muted { color: var(--ink-2) } .small { font-size: 13px } .tiny { font-size: 12px; color: var(--ink-3) }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.row.end { justify-content: flex-end } .grow { flex: 1 1 auto }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start }
.split.doc { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) }
@media (max-width: 1100px) { .split, .split.doc { grid-template-columns: minmax(0, 1fr) } .split.doc > div[style*=sticky] { position: static !important } }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0 }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap }
.btn:hover { background: var(--surface-2) }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn) }
.btn.primary:hover { background: var(--btn-hover) }
.btn.warn { color: var(--danger); border-color: var(--danger) }
.btn.ghost { border-color: transparent; background: none }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.btn svg { width: 16px; height: 16px; flex: none }
.btn.wrap { white-space: normal; text-align: left; justify-content: flex-start; max-width: 100% }
.btn.wrap.next { text-align: right; justify-content: flex-end; margin-left: auto }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap }
.chip.amber { background: var(--amber-soft); color: var(--ink); border-color: var(--amber-line) }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.chip.unit { font-family: var(--f-mono); font-weight: 500 }
.dots { letter-spacing: 1px; color: var(--amber) }

.callout { border-radius: var(--r); padding: 13px 15px; border: 1px solid var(--line); background: var(--info-soft); display: flex; gap: 12px; align-items: flex-start }
.callout b { display: block; margin-bottom: 2px }
.callout.warn { background: var(--amber-soft); border-color: var(--amber-line) }
.callout.danger { background: var(--danger-soft); border-color: transparent; border-left: 5px solid var(--danger) }
.callout > svg { flex: none; width: 22px; height: 22px; margin-top: 1px }
.callout.danger > svg { color: var(--danger) }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field label, .lbl { font-size: 12.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .01em }
.field input, .field select, .field textarea, .inp {
  width: 100%; min-height: 38px; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink) }
.field textarea { min-height: 76px; resize: vertical; line-height: 1.45 }
.field .hint { font-size: 12px; color: var(--ink-3) }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; cursor: pointer }
.check input { width: 17px; height: 17px; accent-color: var(--brand-2) }
fieldset { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; margin: 0; min-width: 0 }
legend { font-size: 12.5px; font-weight: 700; color: var(--ink-2); padding: 0 4px }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto }
.tabs button { border: 0; background: none; padding: 9px 13px; cursor: pointer; color: var(--ink-2); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber) }

.empty { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 22px; text-align: center; color: var(--ink-2) }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--amber-soft); border: 1px solid var(--amber-line); border-radius: var(--r-sm); padding: 8px 10px; font-size: 13.5px }

/* ---------- início */
.hero { background: var(--brand); color: var(--brand-ink); border-radius: var(--r); padding: 24px 24px 22px; position: relative; overflow: hidden }
.hero::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none }
.hero > * { position: relative; z-index: 1 }
.hero .eyebrow { color: var(--amber) }
.hero h1 { color: var(--brand-ink); font-size: clamp(30px, 4vw, 44px); font-weight: 700; margin: 6px 0 8px }
.hero p { color: var(--brand-ink-2); max-width: 62ch }
.hero .flagline { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; display: flex; z-index: 1 }
.hero .flagline i { flex: 1 } .hero .flagline i:nth-child(1) { background: #C8102E } .hero .flagline i:nth-child(2) { background: #F2C200 } .hero .flagline i:nth-child(3) { background: #00843D }
.hero .book { position: absolute; right: 22px; top: 18px; width: 150px; height: 96px; z-index: 0; opacity: .85 }
@media (max-width: 760px) { .hero .book { display: none } }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; color: var(--ink); box-shadow: var(--shadow) }
.tile:hover { border-color: var(--line-2); transform: translateY(-1px) }
.tile .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase }
.tile b { font-family: var(--f-display); font-size: 20px; font-weight: 700 }
.tile span { color: var(--ink-2); font-size: 14px }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px }
.meter { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px }
.meter b { display: block; font-family: var(--f-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1 }
.meter span { font-size: 12.5px; color: var(--ink-2) }

/* ---------- biblioteca */
.lib { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start }
@media (max-width: 1000px) { .lib { grid-template-columns: minmax(0, 1fr) } }
.tree { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); max-height: calc(100vh - 100px); overflow: auto }
@media (max-width: 1000px) { .tree { position: static; max-height: none } }
.tree h3 { font-size: 16px; margin: 4px 0 2px }
.unit { margin-top: 12px }
.unit > div { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px }
.lsn { display: flex; gap: 9px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: var(--r-sm); cursor: pointer; color: var(--ink-2); align-items: baseline }
.lsn:hover { background: var(--surface-2); color: var(--ink) }
.lsn[aria-current="true"] { background: var(--amber-soft); color: var(--ink); font-weight: 650 }
.lsn .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); flex: none }
.lesson { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 74px) }
.lesson h2 { font-size: clamp(25px, 3vw, 32px); margin: 4px 0 8px }
.lesson section { margin-top: 18px }
.lesson section > h3 { font-size: 17px; margin-bottom: 7px; display: flex; align-items: center; gap: 8px }
.lesson section > h3::before { content: ""; width: 10px; height: 10px; border: 2px solid var(--amber); border-radius: 50%; flex: none }
.lesson ul, .lesson ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px }
.lesson .resumo p + p { margin-top: 8px }
.lesson .resumo { font-size: 16px; max-width: 72ch }
.kw { display: flex; flex-wrap: wrap; gap: 6px }
.kw button { cursor: pointer }
.pn { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap }
.gloss dl { margin: 0; display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 10px 18px }
.gloss dt { font-weight: 700 } .gloss dd { margin: 0; color: var(--ink-2) }
@media (max-width: 640px) { .gloss dl { grid-template-columns: minmax(0, 1fr) } .gloss dd { margin-bottom: 8px } }
.syms { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px }
.sym { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px }
.sym svg { width: 100%; height: 64px; color: var(--ink); display: block; margin-bottom: 6px }
.sym b { display: block; font-size: 14.5px } .sym span { font-size: 13px; color: var(--ink-2) }

/* ---------- folhas (pré-visualização dos documentos) */
.sheetwrap { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; overflow-x: auto }
.sheet { background: var(--sheet); color: var(--sheet-ink); width: 100%; max-width: 760px; margin: 0 auto; padding: 32px 34px; box-shadow: 0 2px 10px rgba(10, 34, 64, .18); font: 13.5px/1.45 var(--f-body) }
.sheet h1, .sheet h2, .sheet h3 { color: var(--sheet-navy); font-family: var(--f-body); font-weight: 700 }
.sheet h1 { font-size: 20px; border-bottom: 2px solid var(--sheet-gold); padding-bottom: 4px; margin: 8px 0 8px }
.sheet h2 { font-size: 15.5px; margin: 14px 0 5px } .sheet h3 { font-size: 14px; margin: 10px 0 4px }
.sheet p { margin: 0 0 5px }
.sheet ul, .sheet ol { margin: 0 0 6px; padding-left: 22px }
.sheet table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 0 0 8px }
.sheet td, .sheet th { border: 1px solid var(--sheet-line); padding: 4px 6px; vertical-align: top; text-align: left; word-wrap: break-word }
.sheet th, .sheet td.sh { background: var(--sheet-head) }
.sheet th { overflow-wrap: normal; word-break: keep-all }
.sheet table.nb td { border: 0; padding: 0 }
.sheet .c-navy { color: var(--sheet-navy) } .sheet .c-gold { color: var(--sheet-gold) } .sheet .c-mute { color: var(--sheet-mute) }
.sheet .pbreak { border-top: 2px dashed var(--sheet-line); margin: 22px -34px; position: relative }
.sheet .pbreak::after { content: "nova página"; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); background: var(--sheet); color: var(--sheet-mute); font-size: 11px; padding: 0 8px }
.sheet .ind { padding-left: 24px }
@media (max-width: 600px) { .sheet { padding: 18px 16px; font-size: 12.5px } .sheet .pbreak { margin-left: -16px; margin-right: -16px } }

/* ---------- listas guardadas e banco */
.items { display: flex; flex-direction: column; gap: 10px }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center }
.item .t { font-weight: 700 } .item .grow { min-width: 200px }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 7px }
.q .txt { font-size: 15px } .q ol { margin: 0; padding-left: 22px }
.q details summary { cursor: pointer; color: var(--link); font-size: 13.5px; font-weight: 600 }
.q .ans { margin-top: 6px; background: var(--ok-soft); border-radius: var(--r-sm); padding: 8px 10px; font-size: 14px }
.q li.ok { font-weight: 700; color: var(--ok) }
.sel { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface) }
.sel .n { font-family: var(--f-mono); font-size: 13px; color: var(--ink-3); width: 26px }
.sel .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px }
.sel .act { display: flex; gap: 2px }
.sel .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 2px }
.cotl { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2) }
.cotl input { width: 58px; min-height: 28px; padding: 2px 6px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font-family: var(--f-mono); font-size: 13px; text-align: right }
.cotl input::placeholder { color: var(--ink-3); opacity: 1 }
.picker { max-height: 360px; overflow: auto; display: flex; flex-direction: column; gap: 6px }

/* ---------- calculadoras */
.calcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); gap: 16px; align-items: start }
.calc h2 { font-size: 20px; margin-bottom: 2px }
.formula { font-family: var(--f-mono); background: var(--surface-2); border-radius: var(--r-sm); padding: 6px 10px; display: inline-block; font-size: 14px }
.result { margin-top: 12px; border-top: 1px dashed var(--line-2); padding-top: 12px }
.result .big { font-family: var(--f-mono); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums }
.result .steps { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); margin-top: 4px; white-space: pre-wrap }
.result.err .big { font-size: 15px; font-family: var(--f-body); color: var(--danger) }
.ohm { width: 120px; height: 104px; flex: none; color: var(--ink) }
.tbl { overflow-x: auto; position: relative }
.tbl table { width: 100%; border-collapse: collapse; min-width: 480px }
.tbl th { text-align: left; font-size: 12px; color: var(--ink-2); font-weight: 700; padding: 4px 6px; border-bottom: 1px solid var(--line) }
.tbl td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: middle }
.tbl td.num { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.tbl input { width: 100%; min-height: 34px; padding: 5px 8px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface) }
.tbl input.n { text-align: right; font-family: var(--f-mono) }

/* ---------- avisos */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 520px) }
#toast div { background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow); animation: tin .2s ease }
@keyframes tin { from { opacity: 0; transform: translateY(6px) } }
@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important } }

/* ---------- impressão (só no ficheiro sem internet) */
#print-root { display: none }
@media print {
  @page { size: A4; margin: 14mm 14mm 14mm 20mm }
  body { background: #fff !important; background-image: none !important }
  body::before { display: none }
  body > *:not(#print-root) { display: none !important }
  #print-root { display: block !important }
  #print-root .sheet { box-shadow: none; padding: 0; max-width: none; font-size: 11pt }
  #print-root .pbreak { break-before: page; border: 0; margin: 0 }
  #print-root .pbreak::after { display: none }
}

/* ---------- biblioteca dos manuais */
.picker-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.picker-row .lbl { margin-right: 4px }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px }
.seg button { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 13.5px }
.seg button[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--btn-ink) }
.seg button:hover { border-color: var(--ink-3) }
.toc { display: flex; flex-direction: column; gap: 2px }
.toc .grp { font-size: 11.5px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 4px; padding: 0 8px }
.lesson .resp { margin-top: 6px; background: var(--ok-soft); border-radius: var(--r-sm); padding: 7px 10px; font-size: 14.5px }
.lesson .resp b { color: var(--ok) }
.ex-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px }
.ex-list li { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px }
.ex-list .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 3px }
.ex-list .t b { font-family: var(--f-mono); color: var(--ink-3); font-weight: 500 }
.ex-list .qn { font-family: var(--f-mono); color: var(--ink-3); font-weight: 500; margin-right: 8px }
.ex-list .chip { margin-right: 8px; vertical-align: 1px }
.pares { display: grid; grid-template-columns: max-content auto minmax(0, 1fr); gap: 2px 10px; margin: 6px 0 0 26px; font-size: 14.5px }
.pares .ar { color: var(--ink-3) }
.folha { font-family: var(--f-mono); font-size: 13px; line-height: 1.3; background: var(--sheet); color: var(--sheet-ink); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; overflow-x: auto; white-space: pre; max-width: 100% }
.kv { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr); gap: 6px 14px }
.kv dt { font-weight: 700; color: var(--ink-2); font-size: 13.5px } .kv dd { margin: 0 }
@media (max-width: 600px) { .kv { grid-template-columns: minmax(0, 1fr) } .kv dd { margin-bottom: 6px } }
.datatbl { overflow-x: auto } .datatbl table { border-collapse: collapse; width: 100%; font-size: 14px } .datatbl th, .datatbl td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top }
.datatbl th { background: var(--surface-2); font-size: 12.5px }
.results { display: flex; flex-direction: column; gap: 6px }
.results button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 9px 12px; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; gap: 2px }
.results button:hover { border-color: var(--line-2) }
.results .w { font-size: 12px; color: var(--ink-3) }
.dic-e { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 10px; padding: 10px 0; border-bottom: 1px dashed var(--line) }
.dic-e .em { font-size: 24px; line-height: 1.1 } .dic-e .cr { color: var(--ok); font-weight: 700 }
.lvl { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 6px } .lvl.J { background: #F2C200 } .lvl.L1 { background: #00843D } .lvl.L2 { background: #C8102E }
.big-tab { font-family: var(--f-mono); font-size: clamp(20px, 3.4vw, 30px); display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px 28px }
.big-tab div { padding: 4px 0; border-bottom: 1px dashed var(--line) } .big-tab b { color: var(--ok) }
.note-box { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 10px }
.more { align-self: center }

/* calendário de atividades: uma linha por atividade, com a cor da categoria na margem (a categoria também vai escrita) */
.cal-list { display: flex; flex-direction: column; gap: 8px }
.cal-ev { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--cal-c, var(--line-2)); border-radius: var(--r-sm); padding: 10px 12px; scroll-margin-top: 90px }
.cal-ev.passou { opacity: .6 }
.cal-ev.tri { background: var(--surface-2) }
.cal-d { display: flex; flex-direction: column; align-items: center; line-height: 1.15; color: var(--ink-2); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em }
.cal-d b { font-family: var(--f-display); font-size: 25px; color: var(--ink); letter-spacing: 0; font-weight: 700 }
.cal-tx > b { display: block; font-weight: 650; line-height: 1.35 }
.cal-meta { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 13px; color: var(--ink-2); margin-top: 3px }
.cal-cat { display: inline-flex; align-items: center; gap: 6px; font-weight: 650 }
.cal-cat i { width: 9px; height: 9px; border-radius: 50%; background: var(--cal-c, var(--line-2)); flex: none }
.cal-q { font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap }
.cal-q.perto { color: var(--amber-ink); background: var(--amber); border-radius: 999px; padding: 3px 10px }
.cal-mes h2 { font-size: 19px; margin: 8px 0 10px }
.g-reuniao { --cal-c: #2F6FED } .g-familias { --cal-c: #1F9D60 } .g-provas { --cal-c: #E0A100 } .g-aida { --cal-c: #9B5BD6 } .g-letiva { --cal-c: #5B7DB8 }
.g-feriado { --cal-c: #D9344B } .g-ferias { --cal-c: #E8798A } .g-matriculas { --cal-c: #13A3AE } .g-financeiro { --cal-c: #A67C2E } .g-alusiva { --cal-c: #8A95A8 }
@media (max-width: 560px) { .cal-ev { grid-template-columns: 50px minmax(0, 1fr); gap: 10px } .cal-q { grid-column: 2; justify-self: start } }

/* documentos do CEL */
.doc { padding: 22px 26px }
.doc-cap + .doc-cap { margin-top: 26px }
.doc-cap > h2 { font-size: 21px; display: flex; flex-direction: column; gap: 3px; border-bottom: 2px solid var(--amber); padding-bottom: 7px; margin: 0 0 6px }
.doc-cap > h2 .n { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 500 }
.doc-intro { display: flex; flex-direction: column; gap: 10px }
.doc-art { padding: 12px 0 10px; border-top: 1px solid var(--line); scroll-margin-top: 96px }
.doc-cap > h2 + .doc-art { border-top: 0 }
.doc-art h3 { font-size: 16.5px; margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline }
.doc-art h3 span { font-family: var(--f-body); font-weight: 650; color: var(--ink) }
.doc-art p, .doc-intro p { margin: 6px 0; line-height: 1.55 }
.doc-art p.al { padding-left: 22px }
.doc-art ul, .doc-intro ul { margin: 6px 0; padding-left: 22px } .doc-art li { margin: 3px 0; line-height: 1.5 }
.doc-art h4, .doc-intro h4 { margin: 12px 0 4px; font-size: 15px }
.doc-art .datatbl, .doc-intro .datatbl { margin: 8px 0 }
.doc-art .callout { margin: 8px 0 }
.doc-art.alvo { background: var(--amber-soft); border-radius: var(--r-sm); padding: 12px; border-top-color: transparent }
.doc-fecho { margin-top: 28px; text-align: center; color: var(--ink-2) } .doc-fecho h3 { margin: 0 0 6px; font-size: 16px } .doc-fecho p { margin: 4px 0 }
.doc-hit { text-align: left; cursor: pointer; font: inherit; color: inherit; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline }
.doc-hit:hover { border-color: var(--line-2) }
.doc-snip { flex: 1 1 100% }
@media (max-width: 600px) { .doc { padding: 16px 14px } .doc-art p.al { padding-left: 14px } }
.doc-art p, .doc-intro p, .doc-art li, .doc .datatbl td { overflow-wrap: anywhere }
/* quadros com 3 ou mais colunas: no telemóvel, cada linha passa a um bloco «coluna: valor» */
@media (max-width: 600px) {
  .doc .datatbl.empilha table, .doc .datatbl.empilha tr, .doc .datatbl.empilha td { display: block; width: 100% }
  .doc .datatbl.empilha tr:first-child { display: none }
  .doc .datatbl.empilha tr { border: 1px solid var(--line); border-radius: var(--r-sm); margin-bottom: 8px; padding: 4px 0 }
  .doc .datatbl.empilha td { border: 0; padding: 4px 10px }
  .doc .datatbl.empilha td::before { content: attr(data-l); display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em }
}
@media (max-width: 400px) { .top .mode { display: none } }

/* formações (lista publicada pela coordenação; manuais descarregados quando o professor os pede) */
.f-top { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; align-items: start }
.f-tx h3 { margin: 2px 0 0; font-size: 18px; line-height: 1.3 }
.f-tx > .row { margin-bottom: 4px }
.f-card { scroll-margin-top: 90px }
.f-card .kv { margin: 0 }
.f-resumo p { margin: 0 0 6px; line-height: 1.5 } .f-resumo p:last-child { margin-bottom: 0 }
.f-card h3, .f-resumo p, .f-card dd { overflow-wrap: anywhere }
@media (max-width: 560px) { .f-top { grid-template-columns: 50px minmax(0, 1fr); gap: 10px } }

/* ferramenta do coordenador */
.aviso { background: var(--amber-soft); border-bottom: 1px solid var(--amber-line); color: var(--ink); font-size: 13.5px }
.aviso div { max-width: 1100px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; align-items: center }
.aviso svg { width: 18px; height: 18px; flex: none }
.wrap { max-width: 1100px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px }
.codigo { font-family: var(--f-mono); font-size: clamp(19px, 5vw, 30px); letter-spacing: .04em; background: var(--surface-2); border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 14px; text-align: center; overflow-wrap: anywhere }
.estado { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px }
.estado.ativo { background: var(--ok-soft); color: var(--ok) } .estado.suspenso { background: var(--amber-soft); color: var(--ink) } .estado.retirado { background: var(--danger-soft); color: var(--danger) } .estado.expirado { background: var(--surface-2); color: var(--ink-3) }
.item .meta { font-size: 12.5px; color: var(--ink-2) }
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px }
.counts div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px }
.counts b { display: block; font-family: var(--f-mono); font-size: 24px; font-weight: 500 }
.counts span { font-size: 12.5px; color: var(--ink-2) }
.pendente { border-left: 5px solid var(--amber) }
ol.passos { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px }
textarea.pedido { font-family: var(--f-mono); font-size: 13px; min-height: 130px }
.top .btn { margin-left: auto; background: transparent; color: var(--brand-ink); border-color: rgba(255, 255, 255, .35) }
.top .btn:hover { background: rgba(255, 255, 255, .08) }
.top .btn[hidden] { display: none }
@media (max-width: 420px) { .so-largo { display: none } .tabs { gap: 0; flex-wrap: wrap } .tabs button { padding: 9px 7px; font-size: 14px } }
.cofre { width: 100%; max-width: 520px; margin: 0 auto }
.cofre h1 { font-size: clamp(26px, 7vw, 32px) }
.g-err:empty { display: none }
.g-err { color: var(--danger); font-size: 14px; display: flex; flex-direction: column; gap: 4px }
.g-actions { display: flex; flex-direction: column; gap: 8px }
.g-actions .btn { width: 100%; min-height: 46px; font-size: 15px }
.g-install { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px }
.g-install p { margin: 0; color: var(--ink-2); font-size: 14px }
.pres { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 16px; max-height: 460px; overflow: auto; padding: 2px }
.pres .check { align-items: flex-start; line-height: 1.35 }
.item .t, .item .meta { overflow-wrap: anywhere; min-width: 0 }
ol.passos.small li { line-height: 1.45 }
</style>

<script>/* Códigos de acesso dos Recursos do Professor (CEL-RP1) — partilhado pela aplicação e pela ferramenta do coordenador.
   Código (24 carateres) = validade (2 bytes, dias desde 01/01/2025) + série (1 byte, ao acaso) + chave do ano (12 bytes)
   misturada com HMAC(aparelho | validade | série | nome+contacto). Só abre os manuais no aparelho e com os dados para
   que foi gerado; cada código gerado é diferente, por isso retirar um não afeta o seguinte. */
const CELCODE = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  const DIA0 = Date.UTC(2025, 0, 1), TAM = 24;
  function b32enc(bytes) {
    let out = '', buf = 0, bits = 0;
    for (const b of bytes) { buf = (buf << 8) | b; bits += 8; while (bits >= 5) { bits -= 5; out += B32[(buf >> bits) & 31]; } buf &= (1 << bits) - 1; }
    if (bits) out += B32[(buf << (5 - bits)) & 31];
    return out;
  }
  function limpa(str) { return String(str || '').toUpperCase().replace(/[\s\-_.]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1'); }
  function b32dec(str) {
    const s = limpa(str); let buf = 0, bits = 0; const out = [];
    for (const ch of s) { const v = B32.indexOf(ch); if (v < 0) return null; buf = (buf << 5) | v; bits += 5; if (bits >= 8) { bits -= 8; out.push((buf >> bits) & 255); } buf &= (1 << bits) - 1; }
    return new Uint8Array(out);
  }
  const grupos = (s, g = 4) => String(s).replace(new RegExp(`(.{${g}})(?=.)`, 'g'), '$1-');
  const semAcentos = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
  const normNome = (n) => semAcentos(n).toLowerCase().replace(/\s+/g, ' ').trim();
  const normEmail = (e) => String(e || '').trim().toLowerCase();
  function normTel(w) { let d = String(w || '').replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2); if (d.length === 9) d = '245' + d; return d; }
  function ligacao(p) { const e = normEmail(p.e), w = normTel(p.w); return normNome(p.n) + '|' + (e ? 'e:' + e : 'w:' + w); }
  function diasDe(iso) { const [y, m, d] = String(iso).split('-').map(Number); return Math.round((Date.UTC(y, m - 1, d) - DIA0) / 864e5); }
  function isoDe(n) { return new Date(DIA0 + n * 864e5).toISOString().slice(0, 10); }
  function dataPT(n) { const [y, m, d] = isoDe(n).split('-'); return `${d}/${m}/${y}`; }
  function hojeDias() { const d = new Date(); return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - DIA0) / 864e5); }
  function concat(a, b) { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; }
  function b64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64url = (bytes) => b64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64url = (s) => unb64(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
  async function hmac12(msg) {
    const key = await crypto.subtle.importKey('raw', enc.encode('CEL-RP1'), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return new Uint8Array(await crypto.subtle.sign('HMAC', key, enc.encode(msg))).slice(0, 12);
  }
  async function aesDe(k12) {
    const d = new Uint8Array(await crypto.subtle.digest('SHA-256', concat(enc.encode('CEL-RP1|aes|'), k12)));
    return crypto.subtle.importKey('raw', d.slice(0, 16), 'AES-GCM', false, ['decrypt']);
  }
  async function decifra(key, blob) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(0, 12) }, key, blob.slice(12))); }
  async function impressao(codigo) { const d = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('CEL-RP1|' + limpa(codigo)))); return Array.from(d.slice(0, 6), (b) => b.toString(16).padStart(2, '0')).join(''); }
  // gera o código (ferramenta do coordenador)
  async function gera(k12, aparelho, iso, pedido, serie) {
    const dias = diasDe(iso), s = serie == null ? crypto.getRandomValues(new Uint8Array(1))[0] : serie & 255;
    const hm = await hmac12(`${aparelho}|${dias}|${s}|${ligacao(pedido)}`);
    const out = new Uint8Array(15); out[0] = dias >> 8; out[1] = dias & 255; out[2] = s;
    for (let i = 0; i < 12; i++) out[3 + i] = k12[i] ^ hm[i];
    return b32enc(out);
  }
  // abre um código (aplicação): devolve a chave AES e a validade, ou null
  async function abre(codigo, aparelho, pedido, verificador) {
    const s = limpa(codigo); if (s.length !== TAM) return null;
    const b = b32dec(s); if (!b || b.length < 15) return null;
    const dias = (b[0] << 8) | b[1], hm = await hmac12(`${aparelho}|${dias}|${b[2]}|${ligacao(pedido)}`);
    const k = new Uint8Array(12); for (let i = 0; i < 12; i++) k[i] = b[3 + i] ^ hm[i];
    const key = await aesDe(k);
    try { if (dec.decode(await decifra(key, unb64(verificador))) !== 'CEL-RP1-OK') return null; } catch (e) { return null; }
    return { key, dias };

      h('p', { class: 'small muted' }, `Identificação da chave: ${CFG.chaveId}. Esta chave gera os códigos e abre os manuais cifrados. ${ONLINE ? 'É precisa para abrir esta área noutro aparelho e' : 'É precisa'} para preparar versões novas da aplicação durante este ano letivo; não a envie a ninguém por outro motivo.`),
      h('div', null, btn('Mostrar a chave', { kind: 'ghost', icon: 'key', onclick: () => chave.replaceChildren(h('div', { class: 'codigo', style: 'font-size:18px' }, C.grupos(CHAVE, 5))) })), chave),
    ONLINE ? cartaoGithub() : null, ONLINE ? COFRE.cartaoSeguranca() : null);
}

/* ---------- cofre (versão online): a chave do ano e o registo ficam cifrados neste aparelho com a palavra-passe */
const COFRE = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const VK = 'cel-coord-cofre-' + CFG.chaveId, RK2 = 'cel-coord-registo-' + CFG.chaveId;
  let dataRaw = null, dataKey = null, escondida = 0, installEvt = null;
  const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
  async function kSenha(senha, salt) {
    const base = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function kChave(ch) { return crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', enc.encode('CEL-COORD|rec|' + ch)), 'AES-GCM', false, ['encrypt', 'decrypt']); }
  const kRaw = (raw) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
  async function cif(key, bytes) { const iv = rnd(12); return C.b64(iv) + '.' + C.b64(new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes))); }
  async function decif(key, txt) { const [a, b] = String(txt).split('.'); return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: C.unb64(a) }, key, C.unb64(b))); }
  async function idDe(ch) { const d = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('CEL-RP1|id|' + ch))); return Array.from(d.slice(0, 4), (b) => b.toString(16).padStart(2, '0')).join(''); }
  const instalada = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; const b = document.querySelector('.g-install'); if (b) b.replaceWith(caixaInstalar() || h('span')); });
  function caixaInstalar() {
    if (instalada()) return null;
    return h('div', { class: 'g-install' }, h('b', null, 'Instalar no ecrã do telemóvel'), h('p', null, 'Assim abre esta área como uma aplicação, ao lado dos Recursos do Professor.'),
      installEvt ? btn('Instalar', { kind: 'primary', icon: 'dl', onclick: async () => { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) { /* nada */ } installEvt = null; } })
        : h('p', { class: 'tiny' }, 'No Chrome, toque em ⋮ (em cima, à direita) e depois em «Instalar aplicação» ou «Adicionar ao ecrã principal».'));
  }
  async function abrirCom(raw) {
    dataRaw = raw; dataKey = await kRaw(raw);
    const v = LS.get(VK, null);
    CHAVE = dec.decode(await decif(dataKey, v.chave)); KEY = C.b32dec(CHAVE).slice(0, 12);
    const r = LS.get(RK2, null); reg = r ? JSON.parse(dec.decode(await decif(dataKey, r))) : [];
    gravaRegisto = async () => { if (!dataKey) return false; return LS.set(RK2, await cif(dataKey, enc.encode(JSON.stringify(reg)))); };
    const fl = LS.get(FK, null); FL = fl ? Object.assign(novoFL(), JSON.parse(dec.decode(await decif(dataKey, fl)))) : novoFL();
    gravaFL = async () => { if (!dataKey) return false; return LS.set(FK, await cif(dataKey, enc.encode(JSON.stringify(FL)))); };
    const gk = LS.get(GK, null); GHT = gk ? dec.decode(await decif(dataKey, gk)) : '';
    gravaGHT = async (t) => { if (!dataKey) return false; GHT = t || ''; if (!GHT) { try { localStorage.removeItem(GK); } catch (e) { /* nada */ } return true; } return LS.set(GK, await cif(dataKey, enc.encode(GHT))); };
    fUI = { modo: 'lista', id: null, publicar: false }; fSitio = { estado: '', quando: 0, assin: '' };
    $('#bloquear').hidden = false; aba = 'novo'; desenha();
  }
  async function guardaCofre(ch, senha, raw) {
    const salt = rnd(16), dk = await kRaw(raw);
    const v = { v: 1, chaveId: CFG.chaveId, salt: C.b64(salt), wrapP: await cif(await kSenha(senha, salt), raw), wrapK: await cif(await kChave(ch), raw), chave: await cif(dk, enc.encode(ch)) };
    if (!LS.set(VK, v)) throw new Error('armazenamento');
  }
  function bloquear() { dataRaw = null; dataKey = null; KEY = null; CHAVE = ''; reg = []; rascunho = ''; filtro = { q: '', estado: '' }; gravaRegisto = async () => false;
    FL = novoFL(); GHT = ''; gravaFL = async () => false; gravaGHT = async () => false; fUI = { modo: 'lista', id: null, publicar: false }; fSitio = { estado: '', quando: 0, assin: '' }; fPubEstado.replaceChildren(); $('#bloquear').hidden = true; $('#toast').replaceChildren(); tela(); }
  function moldura(...kids) { $('#tabs').replaceChildren(); $('#painel').replaceChildren(h('div', { class: 'cofre stack' }, ...kids, caixaInstalar())); window.scrollTo(0, 0); }
  const senha = (atual) => h('input', { type: 'password', autocomplete: atual ? 'current-password' : 'new-password', placeholder: atual ? 'A sua palavra-passe' : 'Pelo menos 8 carateres' });
  function tela(modo) {
    const v = LS.get(VK, null);
    if (!v || modo === 'recuperar') { telaChave(!!v); return; }
    const s = senha(true), err = h('div', { class: 'g-err', role: 'alert' }), ok = btn('Abrir', { kind: 'primary', icon: 'lock' });
    const ir = async () => {
      if (!s.value) { err.textContent = 'Escreva a palavra-passe.'; return; }
      ok.disabled = true; err.textContent = 'A abrir…';
      let raw = null;
      try { raw = await decif(await kSenha(s.value, C.unb64(v.salt)), v.wrapP); } catch (e) { raw = null; }
      if (!raw) { err.textContent = 'Palavra-passe errada.'; ok.disabled = false; return; }
      try { err.textContent = ''; await abrirCom(raw); } catch (e) { err.textContent = 'Não foi possível abrir o registo deste aparelho.'; ok.disabled = false; }
    };
    ok.addEventListener('click', ir); s.addEventListener('keydown', (e) => { if (e.key === 'Enter') ir(); });
    moldura(h('h1', null, 'Códigos de acesso'), h('p', { class: 'muted' }, 'Área da coordenação do CEL. Escreva a sua palavra-passe para gerar códigos e gerir os acessos dos professores.'),
      h('div', { class: 'card stack' }, field('c-senha', 'Palavra-passe', s), err, h('div', { class: 'g-actions' }, ok)),
      h('div', { class: 'row', style: 'justify-content:center' }, btn('Esqueci-me da palavra-passe', { kind: 'ghost', onclick: () => tela('recuperar') })));
    setTimeout(() => s.focus(), 60);
  }
  function telaChave(recuperar) {
    const ch = h('input', { type: 'text', class: 'mono', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: 'XXXXX-XXXXX-XXXXX-XXXXX' });
    const s1 = senha(false), s2 = senha(false), err = h('div', { class: 'g-err', role: 'alert' }), ok = btn('Guardar e abrir', { kind: 'primary', icon: 'lock' });
    ok.addEventListener('click', async () => {
      const k = C.limpa(ch.value);
      if (k.length !== 20) { err.textContent = `A chave tem 20 letras e números; esta tem ${k.length}.`; return; }
      if (await idDe(k) !== CFG.chaveId) { err.textContent = `Esta não é a chave do ano letivo ${CFG.ano}. Confirme que a copiou inteira.`; return; }
      if (s1.value.length < 8) { err.textContent = 'A palavra-passe deve ter pelo menos 8 carateres.'; return; }
      if (s1.value !== s2.value) { err.textContent = 'As duas palavras-passe não são iguais.'; return; }
      ok.disabled = true; err.textContent = 'A guardar…';
      try {
        let raw = null; const v = LS.get(VK, null);
        if (v) { try { raw = await decif(await kChave(k), v.wrapK); } catch (e) { raw = null; } }
        if (!raw) raw = rnd(32);
        await guardaCofre(k, s1.value, raw); err.textContent = ''; await abrirCom(raw);
        toast('Palavra-passe guardada neste aparelho.');
      } catch (e) { err.textContent = 'Não foi possível guardar neste navegador.'; ok.disabled = false; }
    });
    moldura(h('h1', null, recuperar ? 'Nova palavra-passe' : 'Primeira utilização'),
      h('p', { class: 'muted' }, recuperar ? 'Cole a chave do ano letivo e escolha uma palavra-passe nova. O registo dos professores mantém-se.'
        : 'Neste aparelho, cole a chave do ano letivo (20 letras e números) e escolha uma palavra-passe só sua. Nas vezes seguintes basta a palavra-passe.'),
      h('div', { class: 'card stack' }, field('c-chave', `Chave do ano letivo ${CFG.ano}`, ch), field('c-s1', 'Palavra-passe nova', s1), field('c-s2', 'Repita a palavra-passe', s2), err, h('div', { class: 'g-actions' }, ok)),
      recuperar ? h('div', { class: 'row', style: 'justify-content:center' }, btn('Voltar', { kind: 'ghost', onclick: () => tela() })) : null);
    setTimeout(() => ch.focus(), 60);
  }
  function cartaoSeguranca() {
    const s1 = senha(false), s2 = senha(false), msg = h('div', { class: 'small', role: 'status' });
    return h('div', { class: 'card stack' }, h('h3', null, 'Segurança deste aparelho'),
      h('p', { class: 'small muted' }, 'A chave e o registo dos professores ficam cifrados neste aparelho com a sua palavra-passe. A área fecha-se sozinha ao fim de 10 minutos fora da aplicação.'),
      h('div', { class: 'fields' }, field('c-n1', 'Palavra-passe nova', s1), field('c-n2', 'Repita a palavra-passe', s2)), msg,
      h('div', { class: 'row' }, btn('Mudar a palavra-passe', { icon: 'lock', onclick: async () => {
        if (s1.value.length < 8) { msg.textContent = 'A palavra-passe deve ter pelo menos 8 carateres.'; return; }
        if (s1.value !== s2.value) { msg.textContent = 'As duas palavras-passe não são iguais.'; return; }
        try { await guardaCofre(CHAVE, s1.value, dataRaw); s1.value = s2.value = ''; msg.textContent = ''; toast('Palavra-passe mudada.'); } catch (e) { msg.textContent = 'Não foi possível guardar.'; }
      } }), btn('Bloquear agora', { kind: 'ghost', icon: 'lock', onclick: bloquear })));
  }
  function inicio() {
    $('#bloquear').addEventListener('click', bloquear);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') escondida = Date.now();
      else if (dataKey && escondida && Date.now() - escondida > 10 * 60e3) bloquear();
    });
    if (!window.crypto || !crypto.subtle) { $('#painel').replaceChildren(h('div', { class: 'callout danger' }, h('div', null, h('b', null, 'Abra esta área no Chrome, pelo endereço https.'), 'Este navegador não consegue proteger a chave.'))); return; }
    tela();
  }
  return { inicio, cartaoSeguranca, bloquear };
})();

/* ---------- arranque */
(async () => {
  $('#sub').textContent = `Recursos do Professor · Ano letivo ${CFG.ano}`;
  $('#aviso-txt').textContent = ONLINE ? 'Área da coordenação, protegida pela sua palavra-passe. A chave e o registo dos professores ficam cifrados neste aparelho.'
    : `Ficheiro privado do coordenador: tem a chave que gera os códigos de ${CFG.ano}. Não o envie a ninguém e não o ponha no GitHub.`;
  if (ONLINE) { COFRE.inicio(); return; }
  const id = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('CEL-RP1|id|' + CFG.chave)))).slice(0, 4).map(b => b.toString(16).padStart(2, '0')).join('');
  if (id !== CFG.chaveId) { $('#painel').replaceChildren(h('div', { class: 'callout danger' }, h('div', null, h('b', null, 'Ficheiro danificado.'), 'A chave não corresponde à identificação. Use a cópia original da ferramenta.'))); return; }
  desenha();
})();
})();
</script>

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});</script>
